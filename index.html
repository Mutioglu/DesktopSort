<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hakkımda</title>
    <style>
        body {
            background-color: lightblue;
            margin: 20px;
        }

        /* Fotoğraf ve yazıyı yan yana getiren kapsayıcı */
        .icerik-kutusu {
            display: flex; /* Yan yana dizilmeyi sağlar */
            align-items: center; /* Dikeyde ortalar */
            gap: 20px; /* Fotoğraf ve yazı arasındaki boşluk */
        }

        /* Fotoğrafın boyutunu kontrol etmek için */
        .profil-fotografi {
            width: 300px; /* Fotoğraf genişliği */
            height: auto; /* Yüksekliği otomatik ayarlar */
        }

        /* Yazı kısmının stili */
        .metin-kismi {
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <h1>Hakkımda:</h1>

    <!-- Ana kapsayıcı div -->
    <div class="icerik-kutusu">
        
        <!-- Fotoğraf -->
        <img src="efefoto2.jpeg" alt="Efe Fotoğraf" class="profil-fotografi">
        
        <!-- Yazı Kısmı -->
        <div class="metin-kismi">
            <h2>Merhaba, Ben Efe</h2>
            <p>----</p>
            <p>----</p>
        </div>

    </div>

</body>
</html>

<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-5" id="uygulama" v-cloak>
        <h1 class="text-center mb-4 text-info">Benimle İletişime Geçin</h1>
        
        <div class="row justify-content-center">
            <div class="col-md-8 bg-body-tertiary p-4 rounded shadow-sm border border-secondary">
                
                <div v-if="hatalar.length > 0" class="alert alert-warning" role="alert">
                    <ul class="mb-0">
                        <li v-for="hata in hatalar">{{ hata }}</li>
                    </ul>
                </div>

                <form id="iletisimFormu" action="islem.php" method="POST" @submit.prevent="formuDenetle">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="adsoyad" class="form-label">Adınız Soyadınız</label>
                            <input type="text" class="form-control" name="adsoyad" id="adsoyad" v-model="formVerileri.adsoyad">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="email" class="form-label">E-Posta Adresi</label>
                            <input type="text" class="form-control" name="email" id="email" v-model="formVerileri.eposta" placeholder="ornek@mail.com">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="telefon" class="form-label">Telefon Numarası</label>
                            <input type="text" class="form-control" name="telefon" id="telefon" v-model="formVerileri.telefon" placeholder="Sadece rakam giriniz">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="sehir" class="form-label">Şehir</label>
                            <select class="form-select" name="sehir" id="sehir" v-model="formVerileri.sehir">
                                <option value="">Şehir Seçiniz...</option>
                                <option value="Düzce">Düzce</option>
                                <option value="Sakarya">Sakarya</option>
                                <option value="İstanbul">İstanbul</option>
                                <option value="Diğer">Diğer</option>
                            </select>
                        </div>
                    </div>

                    <div class="row mb-3 mt-2">
                        <div class="col-md-6">
                            <label class="form-label d-block">Cinsiyet</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="cinsiyet" id="erkek" value="Erkek" v-model="formVerileri.cinsiyet">
                                <label class="form-check-label" for="erkek">Erkek</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="cinsiyet" id="kadin" value="Kadın" v-model="formVerileri.cinsiyet">
                                <label class="form-check-label" for="kadin">Kadın</label>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label d-block">Konu</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="konu[]" value="Proje" v-model="formVerileri.konu">
                                <label class="form-check-label">Proje Teklifi</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="checkbox" name="konu[]" value="Geri Bildirim" v-model="formVerileri.konu">
                                <label class="form-check-label">Geri Bildirim</label>
                            </div>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="mesaj" class="form-label">Mesajınız</label>
                        <textarea class="form-control" name="mesaj" id="mesaj" rows="4" v-model="formVerileri.mesaj"></textarea>
                    </div>

                    <div class="d-flex flex-wrap gap-3 justify-content-center">
                        <button type="submit" class="btn btn-outline-success">Gönder</button>
                        <button type="reset" class="btn btn-outline-secondary" @click="formuTemizle">Formu Temizle</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-5 border-top border-secondary">
        <p class="mb-0">© 2026 Ensar Efe Mutioğlu - Web Teknolojileri Projesi</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.4.21/dist/vue.global.min.js"></script>
    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                return {
                    formVerileri: {
                        adsoyad: '',
                        eposta: '',
                        telefon: '',
                        sehir: '',
                        cinsiyet: '',
                        konu: [],
                        mesaj: ''
                    },
                    hatalar: []
                }
            },
            methods: {
                formuDenetle() {
                    this.hatalar = [];
                    const epostaBicimi = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    const telefonBicimi = /^\d+$/;

                    if (!this.formVerileri.adsoyad.trim()) this.hatalar.push("Ad Soyad alanı boş bırakılamaz.");
                    if (!this.formVerileri.eposta.trim() || !epostaBicimi.test(this.formVerileri.eposta)) this.hatalar.push("Lütfen geçerli bir e-posta adresi giriniz.");
                    if (!this.formVerileri.telefon.trim() || !telefonBicimi.test(this.formVerileri.telefon)) this.hatalar.push("Telefon numarası boş olamaz ve sadece rakamlardan oluşmalıdır.");
                    if (!this.formVerileri.mesaj.trim()) this.hatalar.push("Mesaj alanı boş bırakılamaz.");

                    if (this.hatalar.length === 0) {
                        document.getElementById('iletisimFormu').submit();
                    }
                },
                formuTemizle() {
                    this.hatalar = [];
                    this.formVerileri = {
                        adsoyad: '',
                        eposta: '',
                        telefon: '',
                        sehir: '',
                        cinsiyet: '',
                        konu: [],
                        mesaj: ''
                    };
                }
            }
        }).mount('#uygulama');
    </script>
</body>
</html>
